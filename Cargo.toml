[package]
name = "coderg"
version = "0.1.0"
edition = "2024"
description = "Fast indexed regular-expression search for source trees"
license = "MIT"
autobenches = false

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.11"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "coderg"
path = "src/main.rs"
bench = false

[[bench]]
name = "suite"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
